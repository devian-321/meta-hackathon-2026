[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "faultline-ci"
version = "0.1.0"
description = "Reproducible CI faults and independent recovery evidence for GitLab Duo"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.28.1,<0.29"]

[project.scripts]
faultline = "faultline_ci.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "sample_app"]
